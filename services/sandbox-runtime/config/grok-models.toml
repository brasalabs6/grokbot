# Non-secret model profile based on the local Grok Build configuration.
# Real credentials are injected by the trusted Cloudflare Worker proxy.
# Do NOT replace the placeholder with actual API keys.

[models]
default = "cf-qwen3.8-27b"
default_reasoning_effort = "low"
session_summary = "cf-glm-5.3-flash"
image_description = "cf-glm-5.3-flash"

[model."cf-glm-5.2"]
model = "@cf/zai-org/glm-5.2"
base_url = "https://cf-ai-rate-proxy.brasaimainstream.workers.dev/v1"
name = "CF GLM 5.2 (Brasamain Worker Proxy)"
description = "Z.ai GLM-5.2 via deployed Brasamain Cloudflare Worker rate proxy"
api_backend = "chat_completions"
api_key = "grokbot-internal-placeholder"
context_window = 262144
max_completion_tokens = 16384
temperature = 0.7
stream_tool_calls = true

