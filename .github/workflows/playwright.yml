name: Playwright Tests
on:
  push:
    branches: [main, master, feat/grokbot-p00-acp-cloudflare-spike]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      # Disposable CI-only credentials, never shared with staging or production.
      AUTH_SECRET: grokbot-ci-only-not-a-production-key-2026
      AUTH_TRUST_HOST: "true"
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/grokbot_test
      GROKBOT_ALLOWED_EMAILS: internal-test@example.test
      FEATURE_AGENT_RUNTIME: "0"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: grokbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d grokbot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply isolated PostgreSQL migrations
        run: pnpm db:migrate
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run GrokBot browser acceptance tests
        run: pnpm test
      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
