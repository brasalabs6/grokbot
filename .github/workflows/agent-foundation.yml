name: Agent foundation contracts
on:
  pull_request:
    paths:
      - "lib/agent/**"
      - "lib/db/agent-*.ts"
      - "app/api/agent-sessions/**"
      - "app/agent-sessions/**"
      - "components/agent-sessions/**"
      - "tests/unit/agent-contracts.test.ts"
      - ".github/workflows/agent-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install project
        run: pnpm install --frozen-lockfile
      - name: Agent state and event contract tests
        run: pnpm exec tsx --test tests/unit/agent-contracts.test.ts
      - name: Verify no TypeScript regressions in new agent modules
        shell: bash
        run: |
          pnpm exec tsc --noEmit --pretty false > /tmp/grokbot-ts.log 2>&1 || true
          if grep -E 'error TS.*' /tmp/grokbot-ts.log | grep -E '(app/api/agent-sessions/|app/agent-sessions/|components/agent-sessions/|lib/agent/|lib/db/agent-)' ; then
            echo 'New GrokBot agent module TypeScript errors detected'
            exit 1
          fi
          echo 'Agent modules have no TypeScript errors.'
          echo 'Legacy root typecheck errors (not waived for release):'
          grep -c 'error TS' /tmp/grokbot-ts.log || true
