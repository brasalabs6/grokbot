name: Deploy GrokBot sandbox staging
on:
  workflow_dispatch:
  push:
    branches: [feat/grokbot-p00-acp-cloudflare-spike]
permissions:
  contents: read
concurrency:
  group: grokbot-sandbox-staging
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy isolated staging runtime
    if: github.ref == 'refs/heads/feat/grokbot-p00-acp-cloudflare-spike' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-staging]'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify staging credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing staging secret: CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing staging variable: CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - name: Install runtime dependencies
        working-directory: services/sandbox-runtime
        run: pnpm install --frozen-lockfile
      - name: Verify type contracts
        working-directory: services/sandbox-runtime
        run: pnpm check
      - name: Deploy Cloudflare Worker and container image
        working-directory: services/sandbox-runtime
        run: pnpm exec wrangler deploy
      - name: Verify staging health endpoint
        run: curl --fail --silent --show-error --max-time 20 https://grokbot-sandbox-runtime-staging.guibelongtovi-a22.workers.dev/health
